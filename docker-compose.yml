services:
  hexapod:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        USERNAME: leonv
    container_name: hexapod_ros2
    network_mode: host
    device_cgroup_rules:
      - 'c 81:* rmw' 
      - 'c 189:* rmw'    
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - .:/home/ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
    restart: unless-stopped
    privileged: true
    stdin_open: true
    tty: true
    group_add:
      - video
